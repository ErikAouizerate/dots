---
# The Fedora desktop surface. Most of these packages are not in Fedora's own
# repositories: the repositories that provide them are set up by this role.
workstation_packages:
  # Fedora
  - baobab
  - flatpak
  - grim
  - ptyxis
  - slurp
  - wl-clipboard
  - wtype
  # Fedora, virtualization: the mandatory and default packages of the
  # "virtualization" group. Fedora enables libvirt's modular daemons by
  # systemd preset, so they are socket activated and nothing has to be
  # started by hand.
  - libvirt-daemon-config-network
  - libvirt-daemon-kvm
  - qemu-kvm
  - virt-install
  - virt-manager
  - virt-viewer
  # RPM Fusion
  - vlc
  - vlc-plugins-freeworld
  # Brave, Sublime and Google repositories
  - brave-browser
  - google-chrome-stable
  - sublime-text
  # Microsoft's Visual Studio Code repository
  - code
  # COPRs enabled by this role
  - fira-code-nerd-fonts
  - libinput-gestures
  - starship

# The official language extensions only: TypeScript and CSS ride VSCode's
# built-in support, everything else is one extension per language.
workstation_vscode_extensions:
  - docker.docker
  - golang.go
  - ms-python.python
  - ms-python.vscode-pylance
  - redhat.vscode-yaml
  - stylelint.vscode-stylelint

# virt-manager's SPICE viewer grabs the keyboard while a VM console has the
# focus, and that grab is what makes the host compositor ignore its own
# shortcuts (Mod+Enter, Mod+1..9, ...). The grab follows a property of the
# SPICE display widget that virt-manager never sets and that no preference
# exposes, so the two lines below are inserted into the viewer: spice-gtk then
# leaves the keyboard alone, and the keys still reach the guest. A virt-manager
# upgrade restores the original file, and the next run of this role patches it
# again.
workstation_virtmanager_viewer: /usr/share/virt-manager/virtManager/details/viewers.py
workstation_virtmanager_viewer_anchor: '            display = SpiceClientGtk.Display.new(self._spice_session, channel_id)'
workstation_virtmanager_viewer_patch:
  - '            # patched: keep the keyboard grab off, the host handles its own shortcuts'
  - '            display.set_property("grab-keyboard", False)'

# Compositor helpers, linked from ~/.local/bin into /usr/local/bin.
# miracle-wm and libinput-gestures exec the commands of their bindings without
# a shell and without expanding "~", so the bare name has to resolve on the
# session's PATH, which /usr/local/bin always does.
workstation_wm_helpers:
  - wm-focus-cycle
  - wm-move-window-to-workspace
  - wm-screenshot
  - wm-workspace
