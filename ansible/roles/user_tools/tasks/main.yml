---
# Tools that install into the user's home. They run after the dotfiles role:
# they read their configuration from the symlinked files.
#
# mise install is idempotent by design — everything already installed is a
# no-op check — but it always has to run for Ansible to know, so it never
# reports a change.
- name: Install the runtimes declared in the mise configuration
  ansible.builtin.command:
    cmd: mise install
  changed_when: false

# opencode has no Fedora package and no nix here, so it comes from its own
# installer into ~/.opencode/bin. --no-modify-path because ~/.zshenv owns the
# PATH entry. Piping the installer into a shell is its only documented
# installation method.
- name: Install opencode # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      curl -fsSL https://opencode.ai/v2/install |
      bash -s -- --version {{ user_tools_opencode_version }} --no-modify-path
    creates: "{{ ansible_facts.env.HOME }}/.opencode/bin/opencode"

# ~/.config/opencode/plugins/ponytail is a local plugin: opencode does not
# install a local plugin's dependencies, so a fresh machine needs one npm ci
# (package-lock.json is versioned for exactly that). The directory has to stay
# writable, which is why the dotfiles role links the files of
# ~/.config/opencode individually instead of the whole directory.
- name: Install the ponytail plugin dependencies
  ansible.builtin.command:
    cmd: mise exec -- npm ci
    chdir: "{{ ansible_facts.env.HOME }}/.config/opencode/plugins/ponytail"
    creates: "{{ ansible_facts.env.HOME }}/.config/opencode/plugins/ponytail/node_modules"

# coi (Code on Incus) runs a coding agent in a disposable system container on
# top of the Incus daemon the base role installs, so every profile gets it.
# Fedora packages neither it nor an equivalent, and piping its installer into
# bash is the installation method the project documents.
#
# It runs as root, which is the only way an unattended run can work: the
# installer calls sudo for its system steps and reads the Incus version through
# it, so as a plain user those calls fail as soon as sudo wants a password and
# the script aborts. As root they all succeed, and the binary lands in
# /usr/local/bin, next to the wm-* helpers. HOME points at root's home so the
# pattern databases the installer fetches at the end do not end up root-owned in
# the user's home: `coi update patterns` fetches them as the user when needed.
# NONINTERACTIVE answers the remaining questions, which are the ones about
# installing Incus, joining incus-admin and the root-level extras — the base
# role already does the first two. The passwordless rule for nft is left to
# `coi health --fix`, which the user runs when he wants network isolation.
# creates: keeps the run idempotent, so upgrading means removing the binary.
- name: Install coi # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      curl -fsSL https://raw.githubusercontent.com/coipond/coi/master/install.sh |
      bash
    creates: /usr/local/bin/coi
  environment:
    NONINTERACTIVE: "1"
    HOME: /root
  become: true
