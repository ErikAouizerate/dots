---
# Tools that install into the user's home. They run after the dotfiles role:
# they read their configuration from the symlinked files.
#
# mise install is idempotent by design — everything already installed is a
# no-op check — but it always has to run for Ansible to know, so it never
# reports a change.
- name: Install the runtimes declared in the mise configuration
  ansible.builtin.command:
    cmd: mise install
  changed_when: false

# opencode has no Fedora package and no nix here, so it comes from its own
# installer into ~/.opencode/bin. --no-modify-path because ~/.zshenv owns the
# PATH entry. Piping the installer into a shell is its only documented
# installation method.
- name: Install opencode # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      curl -fsSL https://opencode.ai/v2/install |
      bash -s -- --version {{ user_tools_opencode_version }} --no-modify-path
    creates: "{{ ansible_facts.env.HOME }}/.opencode/bin/opencode"

# ~/.config/opencode/plugins/ponytail is a local plugin: opencode does not
# install a local plugin's dependencies, so a fresh machine needs one npm ci
# (package-lock.json is versioned for exactly that). The directory has to stay
# writable, which is why the dotfiles role links the files of
# ~/.config/opencode individually instead of the whole directory.
- name: Install the ponytail plugin dependencies
  ansible.builtin.command:
    cmd: mise exec -- npm ci
    chdir: "{{ ansible_facts.env.HOME }}/.config/opencode/plugins/ponytail"
    creates: "{{ ansible_facts.env.HOME }}/.config/opencode/plugins/ponytail/node_modules"
