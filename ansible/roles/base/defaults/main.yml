---
# Command line tools that every machine needs, whatever its profile.
base_packages:
  - bat
  - curl
  - direnv
  - fd-find
  - fzf
  - git
  - gitleaks
  - htop
  - incus
  # incusd execs `ip`, which a minimal Fedora install does not necessarily
  # ship even though the incus package does not pull it in.
  - iproute
  - jq
  - nano
  - ripgrep
  - tree
  - unzip
  - zsh
