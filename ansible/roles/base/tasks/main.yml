---
- name: Install the base packages
  ansible.builtin.dnf:
    name: "{{ base_packages }}"
    state: present
  become: true

# mise owns the language runtimes and the CLI tools that are not packaged by
# Fedora (see home/.config/mise/config.toml). It comes from the maintainer's
# COPR, the installation method mise documents for Fedora.
# https://mise.jdx.dev/installing-mise.html
- name: Enable the mise COPR repository
  ansible.builtin.yum_repository:
    name: copr:copr.fedorainfracloud.org:jdxcode:mise
    description: Copr repo for mise owned by jdxcode
    baseurl: https://download.copr.fedorainfracloud.org/results/jdxcode/mise/fedora-$releasever-$basearch/
    gpgkey: https://download.copr.fedorainfracloud.org/results/jdxcode/mise/pubkey.gpg
    gpgcheck: true
    repo_gpgcheck: false
    enabled: true
    skip_if_unavailable: true
  become: true

- name: Install mise
  ansible.builtin.dnf:
    name: mise
    state: present
  become: true

# The dotfiles are only useful if the login shell reads them.
- name: Use zsh as the login shell
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    shell: /usr/bin/zsh
  become: true
