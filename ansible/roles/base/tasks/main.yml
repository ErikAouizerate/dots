---
- name: Install the base packages
  ansible.builtin.dnf:
    name: "{{ base_packages }}"
    state: present
  become: true

# mise owns the language runtimes and the CLI tools that are not packaged by
# Fedora (see home/.config/mise/config.toml). It comes from the maintainer's
# COPR, the installation method mise documents for Fedora.
# https://mise.jdx.dev/installing-mise.html
- name: Enable the mise COPR repository
  ansible.builtin.yum_repository:
    name: copr:copr.fedorainfracloud.org:jdxcode:mise
    description: Copr repo for mise owned by jdxcode
    baseurl: https://download.copr.fedorainfracloud.org/results/jdxcode/mise/fedora-$releasever-$basearch/
    gpgkey: https://download.copr.fedorainfracloud.org/results/jdxcode/mise/pubkey.gpg
    gpgcheck: true
    repo_gpgcheck: false
    enabled: true
    skip_if_unavailable: true
  become: true

- name: Install mise
  ansible.builtin.dnf:
    name: mise
    state: present
  become: true

# The dotfiles are only useful if the login shell reads them.
- name: Use zsh as the login shell
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    shell: /usr/bin/zsh
  become: true

# ~/.zshrc sources $HOME/.oh-my-zsh/oh-my-zsh.sh, and Fedora packages neither
# the framework nor its theme, so it is cloned the way its own installer does
# it. Shallow, and never updated afterwards: update: false keeps the run
# idempotent, and the framework is configuration rather than a package to
# track. version pins the branch that clone starts from.
- name: Install oh-my-zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ ansible_facts.env.HOME }}/.oh-my-zsh"
    version: master
    depth: 1
    update: false

# ---------------------------------------------------------------------------
# Incus (system containers and virtual machines, every profile)
# ---------------------------------------------------------------------------
# The daemon is socket activated and Fedora's preset policy ("disable *")
# leaves its units disabled, so the socket and the boot-time instance startup
# are enabled here. incus.service is started by its socket and must not be
# enabled on its own: incus.socket has the daemon listen on
# /run/incus/unix.socket, whose owner group is incus-admin.
- name: Enable the Incus socket and instance startup
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - incus.socket
    - incus-startup.service
  become: true

# Unprivileged containers map a range of host UIDs/GIDs into the container.
# Fedora ships /etc/subuid, /etc/subgid and newuidmap/newgidmap, so Incus reads
# the root ranges there instead of assuming its own default, and it refuses to
# create a container when that range is shorter than 65536. 1000000:1000000000
# is the default Incus uses on hosts without a shadow setup.
- name: Give root the subordinate UID and GID ranges Incus maps containers to
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: '^root:'
    line: root:1000000:1000000000
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/subuid
    - /etc/subgid
  become: true

# incus-admin is the group of the daemon socket, which is what makes `incus`
# usable without sudo. It comes with the package; a session opened before this
# run does not have it yet, so the user has to log in again.
- name: Allow the user to use Incus without sudo (incus-admin group)
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    groups: incus-admin
    append: true
  become: true

# A daemon with no storage pool cannot create anything, so the first run gives
# it Incus's own minimal setup: the "default" pool (btrfs when /var/lib/incus
# sits on btrfs, the dir driver otherwise) and the incusbr0 bridge, both
# attached to the default profile. Listing the pools first leaves a machine
# that was initialised by hand untouched.
- name: List the Incus storage pools
  ansible.builtin.command:
    cmd: incus storage list --format csv
  register: base_incus_storage
  changed_when: false
  become: true

- name: Initialize Incus (default storage pool and incusbr0)
  ansible.builtin.command:
    cmd: incus admin init --minimal
  when: base_incus_storage.stdout | trim == ''
  changed_when: true
  become: true
