---
# Link every file of the repository's home trees into the real home directory,
# mirroring the layout: home/ on every machine, plus home-workstation/ on the
# workstation profile (see dotfiles_source_dirs). Files that this repository
# does not manage yet are backed up first, with a timestamped suffix.

- name: List the configuration files of the repository
  ansible.builtin.find:
    paths: "{{ item }}"
    file_type: file
    hidden: true
    recurse: true
  loop: "{{ dotfiles_source_dirs }}"
  loop_control:
    label: "{{ item }}"
  register: dotfiles_trees

# subelements yields one item per file, paired with the tree it was found in,
# which is what the relative path is computed against.
- name: Build the list of links to create
  ansible.builtin.set_fact:
    dotfiles_links: >-
      {{ dotfiles_links | default([]) +
         [{'src': item.1.path,
           'dest': ansible_facts.env.HOME ~ '/' ~ (item.1.path | relpath(item.0.item))}] }}
  loop: "{{ dotfiles_trees.results | subelements('files') }}"
  loop_control:
    label: "{{ item.1.path | relpath(item.0.item) }}"

# ansible.builtin.file does not create the parent directories of a link. The
# home directory itself is skipped: it always exists, and it must keep the
# permissions it has. No mode on purpose, for the same reason: existing
# directories keep theirs, new ones are created with the umask in force.
- name: Create the directories the links live in # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop: >-
    {{ dotfiles_links | default([]) | map(attribute='dest') | map('dirname')
       | reject('eq', ansible_facts.env.HOME) | unique | list }}

- name: Look for configuration files that are already present
  ansible.builtin.stat:
    path: "{{ item.dest }}"
    follow: false
  loop: "{{ dotfiles_links | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  register: dotfiles_present

- name: Back up the configuration files this repository does not manage yet
  ansible.builtin.command:
    argv:
      - mv
      - "{{ item.item.dest }}"
      - "{{ item.item.dest }}.bak.{{ dotfiles_backup_suffix }}"
  loop: "{{ dotfiles_present.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when:
    - item.stat.exists
    # lnk_target is the target exactly as it was written, and the links this
    # role creates are absolute. Comparing lnk_source instead would compare
    # resolved paths, and would mistake a home directory that is itself a
    # symlink for a stale link.
    - not (item.stat.islnk | default(false) and item.stat.lnk_target | default('') == item.item.src)
  changed_when: true

- name: Link the configuration files into the home directory
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ dotfiles_links | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
