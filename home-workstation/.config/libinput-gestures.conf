# 3-finger swipe left → next workspace
# libinput-gestures runs these through shlex.split + Popen, without a shell:
# neither ~ nor $HOME is expanded, and the command has to be found on PATH.
# The wm-* helpers live in ~/.local/bin and are also linked into /usr/local/bin
# by the Ansible workstation role.
gesture swipe left 3 wm-workspace next

# 3-finger swipe right → previous workspace
gesture swipe right 3 wm-workspace prev

